<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooker | Lezzetlerin Dünyası</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="showPage('home')">
                <i class="fa-solid fa-utensils"></i>
                <span>Cooker</span>
            </a>
            <div class="nav-links">
                <a href="#" onclick="showPage('home')"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
                <div id="authSection" style="display: flex; gap: 10px; align-items: center;">
                    <!-- Dinamik olarak JS ile dolacak (Giriş Yap / Profil) -->
                </div>
                <a href="#" class="btn-add" id="addRecipeBtn" style="display:none" onclick="showPage('add')">
                    <i class="fa-solid fa-plus"></i> Tarif Ekle
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Giriş/Kayıt Modalı -->
        <div id="authModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeAuthModal()">&times;</span>
                <div id="loginForm">
                    <h2>Tekrar Hoşgeldin</h2>
                    <input type="email" id="loginEmail" placeholder="E-posta">
                    <input type="password" id="loginPass" placeholder="Şifre">
                    <button onclick="handleEmailLogin()" class="btn-submit">Giriş Yap</button>
                    <div class="divider">veya</div>
                    <button onclick="loginWithGoogle()" class="btn-google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google ile Giriş Yap
                    </button>
                    <p class="switch-auth">Hesabın yok mu? <a href="#" onclick="toggleAuthMode(true)">Kayıt Ol</a></p>
                </div>
                <div id="signupForm" style="display:none">
                    <h2>Hesap Oluştur</h2>
                    <input type="email" id="signupEmail" placeholder="E-posta">
                    <input type="password" id="signupPass" placeholder="Şifre">
                    <button onclick="handleEmailSignUp()" class="btn-submit">Kayıt Ol</button>
                    <div class="divider">veya</div>
                    <button onclick="loginWithGoogle()" class="btn-google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google ile Kayıt Ol
                    </button>
                    <p class="switch-auth">Zaten üye misin? <a href="#" onclick="toggleAuthMode(false)">Giriş Yap</a></p>
                </div>
            </div>
        </div>

        <!-- Ana Sayfa -->
        <section id="home" class="page active">

            <div class="page-header">
                <h1>Keşfetmeye Başla</h1>
                <p>Binlerce lezzetli tarif arasından seçimini yap veya kendi tarifini paylaş.</p>
            </div>
            <div id="recipeContainer" class="recipe-grid">
                <!-- Tarifler JS ile buraya gelecek -->
            </div>
        </section>

        <!-- Tarif Ekleme Sayfası -->
        <section id="add" class="page">
            <div class="form-container">
                <div class="form-header">
                    <h2>Yeni Tarif Paylaş</h2>
                    <p>Dünyaya yeni bir lezzet tanıtın!</p>
                </div>
                <form id="recipeForm">
                    <div class="form-group">
                        <label for="title">Tarif Başlığı</label>
                        <input type="text" id="title" placeholder="Örn: Kremalı Mantarlı Makarna" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cookTime">Pişirme Süresi (Dakika)</label>
                            <input type="number" id="cookTime" placeholder="30" required>
                        </div>
                        <div class="form-group">
                            <label for="difficulty">Zorluk Seviyesi</label>
                            <select id="difficulty">
                                <option value="Kolay">Kolay</option>
                                <option value="Orta">Orta</option>
                                <option value="Zor">Zor</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="ingredients">Malzemeler (Virgülle ayırın)</label>
                        <textarea id="ingredients" rows="3" placeholder="Örn: Makarna, Mantar, Krema, Sarımsak" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="instructions">Hazırlanışı</label>
                        <textarea id="instructions" rows="6" placeholder="Adım adım nasıl yapıldığını anlatın..." required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-paper-plane"></i> Tarifi Yayınla
                    </button>
                </form>
            </div>
        </section>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="assets/app.js"></script>
</body>
</html>
